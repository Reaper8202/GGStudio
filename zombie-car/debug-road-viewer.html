<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #202020; }
      #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .cell { position: relative; width: 420px; height: 420px; background: #303030; }
      .cell canvas { width: 100%; height: 100%; display: block; }
      .label { position: absolute; top: 4px; left: 4px; color: #fff; font: 12px monospace; background: #000a; padding: 2px 4px; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module">
      import * as THREE from "three";
      import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
      import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

      const assets = [
        ["Road-Street6-B", 0],
        ["Road-Street6-B", Math.PI / 2],
        ["Road-Street6-A", 0],
        ["Road-Street6-A", Math.PI / 2],
        ["Road-Crossing-A", 0],
        ["Road-Crossing-B", 0],
      ];

      const grid = document.getElementById("grid");

      async function loadAndRender([name, rotation]) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `${name} rot=${rotation.toFixed(2)}`;
        cell.appendChild(label);
        grid.appendChild(cell);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(420, 420);
        cell.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x303030);

        // Pure top-down orthographic-ish view: X axis (red) runs left-right
        // across the image, Z axis (blue) runs top-to-bottom (away from
        // camera = +Z, per three.js's AxesHelper convention). No grid
        // helper this time -- its center-cross lines were the same red as
        // the axes helper and made the last render ambiguous.
        const axes = new THREE.AxesHelper(1.2);
        scene.add(axes);

        const camSize = 1.3;
        const camera = new THREE.OrthographicCamera(-camSize, camSize, camSize, -camSize, 0.1, 100);
        camera.position.set(0, 10, 0.0001);
        camera.lookAt(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(0, 10, 0);
        scene.add(dir);

        const base = `/assets/graveyard/${name}`;
        const materials = await new MTLLoader().loadAsync(`${base}.mtl`);
        materials.preload();
        const object = await new OBJLoader().setMaterials(materials).loadAsync(`${base}.obj`);

        const bounds = new THREE.Box3().setFromObject(object);
        const center = bounds.getCenter(new THREE.Vector3());
        object.position.set(-center.x, -bounds.min.y, -center.z);

        // Match production exactly: recenter offset lives on the inner
        // object, rotation is applied to an OUTER wrapper -- so rotation
        // pivots around the model's own footprint center, not around
        // whatever (0,0,0) happened to be in the raw exported mesh data.
        const root = new THREE.Group();
        root.add(object);
        root.rotation.y = rotation;
        scene.add(root);
        renderer.render(scene, camera);

        const size = bounds.getSize(new THREE.Vector3());
        label.textContent = `${name} rot=${rotation.toFixed(2)} size=(${size.x.toFixed(2)},${size.y.toFixed(2)},${size.z.toFixed(2)})`;
      }

      for (const name of assets) {
        await loadAndRender(name);
      }
      window.__viewerDone = true;
    </script>
  </body>
</html>
